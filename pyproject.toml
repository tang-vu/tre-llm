[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tre-llm"
version = "0.1.0"
description = "LLM tiếng Việt, vừa sức máy bạn — Vietnamese local AI that fits your machine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Tăng Minh Vũ / tang-vu" }]
keywords = ["llm", "vietnamese", "local-ai", "llama.cpp", "edge-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.3,<0.20",
    "rich>=13.7,<15",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<0.29",
    "fastapi>=0.110,<0.120",
    "uvicorn>=0.29,<0.36",
    "pyyaml>=6.0,<7",
    "platformdirs>=4.2,<5",
    "psutil>=5.9,<8",
    "pypdf>=5.0,<7",
]

[project.optional-dependencies]
train = [
    "torch>=2.4,<2.9",
    "transformers>=4.44,<5",
    "peft>=0.12,<0.18",
    "trl>=0.9.6,<0.22",
    "datasets>=2.20,<4",
    "accelerate>=0.33,<2",
    "sentencepiece>=0.2,<0.3",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.5,<0.9",
    "mypy>=1.10,<1.16",
    "build>=1.2,<2",
    "types-psutil",
    "types-pyyaml",
]

[project.scripts]
tre = "tre_llm.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tre_llm"]

[tool.hatch.build.targets.wheel.force-include]
"apps/web/dist" = "tre_llm/webui"
"models/registry" = "tre_llm/data/registry"
"evals/tre-viet" = "tre_llm/data/evals/tre-viet"
"recipes" = "tre_llm/data/recipes"

[tool.hatch.build.targets.sdist]
include = [
    "src/tre_llm",
    "models/registry",
    "evals/tre-viet",
    "recipes",
    "configs",
    "apps/web",
    "examples",
    "tests",
    "docs",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.5,<0.9",
    "mypy>=1.10,<1.16",
    "build>=1.2,<2",
    "types-psutil",
    "types-pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120"
markers = [
    "integration: tests requiring real model artifacts or network",
    "gpu: tests requiring GPU hardware",
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["tre_llm"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
